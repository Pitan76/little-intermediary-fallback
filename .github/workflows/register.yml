name: Manual Register to ModParks

on:
  workflow_dispatch:
    inputs:
      tag:
        required: true
        description: Release tag (e.g. v1.0.0)

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Get release
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = "${{ inputs.tag }}";

            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag
            });

            core.setOutput("name", release.data.assets[0].name);
            core.setOutput("body", release.data.body || "");

      - name: Register to ModParks
        env:
          MODPARKS_URL: "https://modparks.pitan76.net"
          PROJECT_SLUG: "little-intermediary-fallback"
          VERSION_NUMBER: ${{ inputs.tag }}
        run: |
          FILE_NAME="${{ steps.release.outputs.name }}"
          FILE_URL="https://github.com/${{ github.repository }}/releases/download/${VERSION_NUMBER}/${FILE_NAME}"

          curl -X POST "$MODPARKS_URL/api/v1/projects/$PROJECT_SLUG/versions" \
            -H "Authorization: Bearer ${{ secrets.MODPARKS_API_KEY }}" \
            -F "versionNumber=$VERSION_NUMBER" \
            -F "mcVersions=26.1" \
            -F "mcVersions=26.1.1" \
            -F "mcVersions=26.1.2" \
            -F "loaders=fabric" \
            -F "changelog=${{ steps.release.outputs.body }}" \
            -F "fileUrl=$FILE_URL"
