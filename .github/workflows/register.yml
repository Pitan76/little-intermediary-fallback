name: Register to ModParks

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Register release URL to ModParks
        env:
          MODPARKS_URL: "https://modparks.pitan76.net"
          PROJECT_SLUG: "little-intermediary-fallback"
          VERSION_NUMBER: ${{ github.event.release.tag_name }}
          FILE_URL: "https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/${{ github.event.release.assets[0].name }}"
        run: |
          curl -X POST "$MODPARKS_URL/api/v1/projects/$PROJECT_SLUG/versions" \
            -H "Authorization: Bearer ${{ secrets.MODPARKS_API_KEY }}" \
            -F "versionNumber=$VERSION_NUMBER" \
            -F "mcVersions=26.1" \
            -F "mcVersions=26.1.1" \
            -F "mcVersions=26.1.2" \
            -F "loaders=fabric" \
            -F "changelog=${{ github.event.release.body }}" \
            -F "fileUrl=$FILE_URL"
