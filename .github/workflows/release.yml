name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/*.jar
          body: |
            ${{ github.event.head_commit.message }}
          generate_release_notes: true

      - name: Register to ModParks
        env:
          MODPARKS_URL: https://modparks.pitan76.net
          PROJECT_SLUG: little-intermediary-fallback
          VERSION_NUMBER: ${{ github.ref_name }}
        run: |
          FILE_NAME=$(basename build/libs/*.jar)
          FILE_URL="https://github.com/${{ github.repository }}/releases/download/${VERSION_NUMBER}/${FILE_NAME}"
          
          curl -X POST "$MODPARKS_URL/api/v1/projects/$PROJECT_SLUG/versions" \
            -H "Authorization: Bearer ${{ secrets.MODPARKS_API_KEY }}" \
            -F "versionNumber=$VERSION_NUMBER" \
            -F "mcVersions=26.1" \
            -F "mcVersions=26.1.1" \
            -F "mcVersions=26.1.2" \
            -F "loaders=fabric" \
            -F "changelog=${{ github.event.head_commit.message }}" \
            -F "fileUrl=$FILE_URL"
